# Events entered by hand. They appear on the page until their date passes
# (past ones disappear automatically, so you never need to delete them).
# If a newsletter later announces the same event on the same date for the same
# chamber, the hand-entered version is used and the newsletter copy is dropped,
# so nothing shows twice.
#
# To add one, copy a block below and change the fields. Dates are YYYY-MM-DD.
# 'details' is the short description shown under the title.
events:

  - chamber: GABA
    title: "Global Business Outlook 2027"
    date: 2026-12-01
    location: San Francisco
    details: "6 PM. Economic outlook after the US midterms, with Germany Trade & Invest and Open Austria."
    url: "https://members.gaba-network.org/norcal-events"

# Events to never show, even if a newsletter or website announces them.
# Each entry is a piece of the title (capitals do not matter). Used for events
# run by member organisations rather than by the chamber itself.
exclude:
  - "Gänsebraten"
  - "Goose Dinner"
  - "Weihnachtsmarkt"
  - "German Holiday Market"
